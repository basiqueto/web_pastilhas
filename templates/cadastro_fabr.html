{% extends 'base.html' %}

{% block conteudo %}

<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
    Novo Fabricante
</button>

<!--Cadastro de NOVO FABRICANTE-->

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel"><strong>Novo Fabricante</strong></h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form class="form-cadastro2" action="{{ url_for('fabricantes')}}" method="post">
                    <label for="input_nome">Nome:</label>
                    <input id="input_nome" placeholder="Digite o nome" type="text" name="form-uso"
                           class="form-control w-100">

                    <label for="input_cnpj">CNPJ:</label>
                    <input id="input_cnpj" placeholder="Digite o CNPJ" type="number" name="form-material"
                           class="form-control w-100">


                    <button type="submit" class="btn btn-info">Cadastrar</button>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<table class="table">
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">Nome</th>
        <th scope="col">CNPJ</th>
    </tr>
    </thead>

</table>


{% endblock %}
