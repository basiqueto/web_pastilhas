<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Base</title>
    <!--Link do BOOTSTRAP - antes do CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Link de Icons do Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--Link do CSS-->
    <link rel="stylesheet" href="../static/css/style.css">
</head>


<body>
<div class="main">
    <div class="menu">
        <img  src="../static/img/logo.png" height="100" width="290"/>
        <ul>
            <li><a href="{{url_for('login')}}">ENTRAR</a></li>
            <li><a href="{{url_for('fabricantes')}}">NOVO FABRICANTE</a></li>
            <li><a href="{{url_for('fornecedores')}}">NOVO FORNECEDOR</a></li>
        </ul>

    </div>

    <div class="conteudo">
        {% block conteudo %}

        {% endblock %}
    </div>
</div>
<!-- Link do javascript para o bootstrap - Sempre no final do body-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
