{% extends 'base.html' %}

{% block conteudo %}

<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
    Novo Fornecedor
</button>

<!--Cadastro de NOVO FORNECEDOR-->

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel"><strong>Novo Fornecedor</strong></h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form class="form-cadastro2" action="{{ url_for('fornecedores')}}" method="post">
                    <label for="input_nome">Nome:</label>
                    <input id="input_nome" placeholder="Digite o nome" type="text" name="form-uso"
                           class="form-control w-100">

                    <label for="input_cnpj">CNPJ:</label>
                    <input id="input_cnpj" placeholder="Digite o CNPJ" type="number" name="form-material"
                           class="form-control w-100">

                    <label for="input_email">Email:</label>
                    <input id="input_email" placeholder="Digite o email" type="text" name="form-material"
                           class="form-control w-100">


                    <button type="submit" class="btn btn-info">Cadastrar</button>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<table class="table">
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">Nome</th>
        <th scope="col">CNPJ</th>
        <th scope="col">Email</th>
        <th scope="col">Criado em</th>
    </tr>
    </thead>

    {% for fornecedor in listar_fornecedor %}

    <tr>
        <td>{{ fornecedor.id }}</td>
        <td>{{ fornecedor.nome }}</td>
        <td>{{ fornecedor.cnpj }}</td>
        <td>{{ fornecedor.email }}</td>
        <td>{{ fornecedor.criado_em }}</td>
        <td>
            <a href=""><i class="bi bi-pencil"></i> </a>
            <a href=""><i class="bi bi-trash text-danger"></i> </a>
        </td>
        {% endfor %}
    </tr>

</table>

{% endblock %}
